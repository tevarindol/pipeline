[workspace]
members = ["lab6", "object2", "object3", "common"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
common = { path = "common" }
slint = "1.18.1"
slint-build = "1.18.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
anyhow = "1.0.104"
interprocess = { version = "2.4.7", features = ["tokio"] }
